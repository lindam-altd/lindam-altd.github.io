<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Prevents search engines from indexing the site while under construction -->
    <meta name="robots" content="noindex, nofollow">
    <title>Coming Soon</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #E6E6FA;
            --text-muted: #b0b0d0;
            --accent-gold: #D4AF37;
            --accent-lavender: #E6E6FA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 24px;
            background: rgba(212, 175, 55, 0.05);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent-lavender) 40%, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .contact-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid var(--accent-gold);
            transition: opacity 0.2s ease;
        }

        .contact-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Under Construction</div>
        <h1>Something new is in the works.</h1>
        <p>We are currently building our site to bring you custom designs, alterations, and tailored garments. Check back soon for updates.</p>
    </div>
</body>
</html>
